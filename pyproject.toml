[project]
name = "enterprise-secops-mcp"
version = "1.0.0"
description = "Unified Enterprise SecOps & Infrastructure MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "azure-identity>=1.16.0",
    "azure-mgmt-monitor>=6.0.0",
    "google-cloud-monitoring>=2.19.0",
    "paramiko>=3.4.0",
    "netmiko>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
secops-mcp = "secops_mcp.server:main"
